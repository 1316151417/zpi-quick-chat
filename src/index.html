<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Quick Chat</title><link rel="stylesheet" href="./style.css"></head>
<body><header><strong>快速对话</strong><span id="model"></span><div class="actions"><button id="new" title="新建对话 ⌥⇧Space">＋</button><button id="hide" title="隐藏 Esc">−</button><button id="quit" title="退出">×</button></div></header><main id="messages" aria-live="polite"><div class="empty">随时问一句，也可以带入文字或图片。</div></main><div id="error" role="alert" hidden></div><section id="images" aria-label="待发送图片"></section><form id="composer"><textarea id="input" rows="2" placeholder="提问、翻译或润色…" aria-label="输入内容" autofocus></textarea><footer><label class="attach" title="添加图片">＋<input id="files" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></label><span>Enter 发送 · Shift+Enter 换行</span><button id="send" type="submit">发送 ↑</button><button id="stop" type="button" hidden>停止 ■</button></footer></form><script type="module" src="./renderer.js"></script></body></html>
