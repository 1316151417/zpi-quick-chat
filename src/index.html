<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Quick Chat</title><link rel="stylesheet" href="./style.css"></head>
<body>
  <div id="window">
  <header>
    <button id="new" title="新建对话 ⌥⇧Space" aria-label="新对话"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="pin" aria-label="固定窗口" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 9V3H8v6l-3 4v3h14v-3ZM12 16v6"/></svg></button>
  </header>
  <main id="messages" tabindex="0" aria-live="polite" aria-label="对话消息"></main>
  <div id="composer-container">
    <form id="composer">
      <section id="images" aria-label="待发送图片"></section>
      <div id="input-row">
        <textarea id="input" rows="1" maxlength="32000" placeholder="输入消息…" aria-label="输入内容" autofocus></textarea>
        <div id="tool-options" aria-label="本次会话工具">
          <button id="web" type="button" aria-label="联网搜索" aria-pressed="false" title="启用联网搜索"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></svg></button>
          <button id="bash" type="button" aria-label="Bash" aria-pressed="false" title="启用 Bash"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 11 2-2-2-2M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg></button>
        </div>
        <button id="send" type="submit" aria-label="发送" title="发送" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14"/></svg></button>
        <button id="stop" type="button" aria-label="停止" title="停止生成" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
      </div>
      <div id="error" role="alert" hidden></div>
    </form>
  </div>
  </div>
  <dialog id="image-preview" aria-label="图片预览"><button type="button" aria-label="关闭图片预览">×</button><img alt=""></dialog>
  <div id="answer-sources" class="answer-sources-popover" popover="auto" role="dialog" aria-labelledby="sources-heading">
    <div class="answer-sources-heading"><span id="sources-heading">来源 <span id="sources-count"></span></span><button id="close-sources" type="button" aria-label="关闭来源">×</button></div>
    <ul id="sources-list" aria-label="来源网页"></ul>
  </div>
  <script type="module" src="./renderer.js"></script>
</body></html>
